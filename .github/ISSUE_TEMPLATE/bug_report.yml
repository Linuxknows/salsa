name: Bug Report
description: Report a bug in Salsa using the built-in Salsa Live Architecture & Interaction Debugger (salsa-debug)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with **Salsa (`lasapi`)**! For security vulnerabilities, please stop here and use [Private Vulnerability Reporting](https://github.com/Linuxknows/salsa/security/advisories/new) instead.

        ### Use the Salsa Live Debugger (`salsa-debug`) First
        Salsa includes a built-in real-time debugger (**`salsa-debug`**) designed to pinpoint audio, routing, Bluetooth, RT timing, and Wayland `ScreenCast` issues automatically:
        - **GUI Workflow**: Launch **`salsa-debug`** (from your app launcher, the tray Quick Mixer **`Debug`** button, or terminal), reproduce the issue while watching **Live Event Stream** / **App & Process Routing Audit**, run the relevant probe on **Boundary, Configs & Probes** (`Run All Socket & PA/PW Probes`, `Play 440Hz LASAPI Probe Tone`, `Send MIDI Note Ping (C4)`) or **ScreenCast Broker** (`Run PW Self-Test`), and click **`Export Bundle`** in the top bar to save a timestamped diagnostic `.zip` you can drag-and-drop into this issue.
        - **CLI Workflow**:
          ```bash
          salsa-debug --export          # Generates a complete diagnostic .zip bundle (includes report.txt, JSON snapshots & logs)
          salsa-debug --text            # Prints the full plain-text debug report to paste below
          salsa-debug --probe           # Runs IPC, dlopen, PA v35, and PW socket health probes
          salsa-debug --stream --telem  # Streams live subsystem events while reproducing the issue
          ```

  - type: input
    id: salsa_version
    attributes:
      label: Salsa Version
      description: Output of `lasapi-ctl --version` or `salsa-debug --version` (e.g., `V2.27.3`)
      placeholder: "V2.27.3"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Audio Engine / WaveRT / ALSA Direct (`lasapi-audiodg`)
        - PulseAudio v35 Compatibility / App Audio (`pa_server` / `pa_reconnect`)
        - Bluetooth Audio (`BlueZ` LDAC / aptX / AAC / SBC / HFP / AVRCP)
        - Wayland ScreenCast `pipewire-0` Video Broker (`pw_broker`)
        - Salsa / Live Debugger / System Tray (`qt6/` Wayland & X11 UI)
        - Installer / Autosync / CLI (`install-salsa.sh` / `salsa-installer` / `lasapi-ctl`)
        - DAW MIDI Hub / Shims (`lasapi-run`)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Linux Distribution, Kernel & Desktop Session
      description: Distro, kernel (`uname -r`), and compositor/desktop (e.g., KDE Plasma 6 Wayland, Hyprland, Sway, GNOME, X11)
      placeholder: "CachyOS, Linux 6.x, KDE Plasma 6 (Wayland, 1.5x fractional scaling)"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Audio / Bluetooth Hardware
      description: Soundcard, USB DAC/interface, or Bluetooth headset model & negotiated codec
      placeholder: "Focusrite Scarlett 2i2 4th Gen / Bose QC Ultra 2 (AAC)"

  - type: textarea
    id: description
    attributes:
      label: What Happened & Steps to Reproduce
      description: Clear step-by-step instructions to reproduce the behavior vs. what you expected
    validations:
      required: true

  - type: checkboxes
    id: debugger_checks
    attributes:
      label: Salsa Live Debugger (`salsa-debug`) Checks Performed
      description: Select any `salsa-debug` diagnostics you ran while reproducing the issue
      options:
        - label: Clicked **Export Bundle** in `salsa-debug` (or ran `salsa-debug --export`) and attached the `.zip` below
        - label: Checked **App & Process Routing Audit** (`--tab 1` / `salsa-debug --audit`) to verify how the affected app is routed
        - label: Ran **Run All Socket & PA/PW Probes** (`--tab 3` / `salsa-debug --probe`)
        - label: Tested physical output via **Play 440Hz LASAPI Probe Tone** (`salsa-debug --tone`) or **Run PW Self-Test** (`--tab 4`)

  - type: textarea
    id: debugger_output
    attributes:
      label: Salsa Debugger Report (`salsa-debug --text` / `--probe`) & Diagnostic Bundle
      description: Paste output from `salsa-debug --text` or `salsa-debug --probe` (or drag-and-drop the `.zip` archive generated by `Export Bundle` / `salsa-debug --export` into the issue description after switching to Markdown preview/upload)
      placeholder: |
        Paste `salsa-debug --text` or `salsa-debug --probe` output here, or attach your exported `salsa-debug` bundle `.zip`.
    validations:
      required: true
