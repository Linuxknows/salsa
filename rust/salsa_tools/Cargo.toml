[package]
name = "salsa_tools"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
publish = false

[lib]
name = "salsa_tools"
path = "src/lib.rs"

[[bin]]
name = "lasapi-run"
path = "src/bin/lasapi_run.rs"

[[bin]]
name = "lasapi-autosync"
path = "src/bin/lasapi_autosync.rs"

[[bin]]
name = "salsa-installer"
path = "src/bin/salsa_installer.rs"

[[bin]]
name = "salsa-dist"
path = "src/bin/salsa_dist.rs"

[[bin]]
name = "salsa-debug-cli"
path = "src/bin/salsa_debug_cli.rs"

[[bin]]
name = "salsa-regression"
path = "src/bin/salsa_regression.rs"

[dependencies]
salsa_net = { path = "../salsa_net" }
lasapi_client = { path = "../lasapi_client" }
