[package]
name = "salsa_net"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "salsa_wire"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "lwasapi-audiodg"
path = "src/bin/lwasapi_audiodg.rs"

[[bin]]
name = "lwasapi-ctl"
path = "src/bin/lwasapi_ctl.rs"

[profile.release]
opt-level = 3
lto = false
panic = "abort"
overflow-checks = true
strip = "debuginfo"
